<style>
/* Kleemax — self-hosted, files live in ./fonts/ next to this HTML.
   Demo build only includes UPPERCASE letters, numbers and a few
   symbols — so it's used only on all-caps / numeric elements below;
   everything else keeps the Orbitron/Rajdhani pairing. */
@font-face{
  font-family:"Kleemax";
  src:url("./fonts/KleemaxDemo.otf") format("opentype"),
      url("./fonts/KleemaxDEMO.ttf") format("truetype");
  font-weight:400;
  font-display:swap;
}

/* ================================================================
   TOKENS — cyberpunk / system-window aesthetic
   ================================================================ */
:root{
  --bg:        #04060b;
  --bg2:       #070c16;
  --panel:     rgba(9,15,28,0.62);
  --panel-solid: #0a1122;
  --cyan:      #57e6ff;
  --cyan-soft: #1c8fae;
  --violet:    #9b7bff;
  --duck:      #ffcc4d;
  --danger:    #ff4463;
  --ink:       #eaf7ff;
  --ink-dim:   #7793a8;
  --line:      rgba(87,230,255,0.28);

  --font-display: "Orbitron", sans-serif;
  --font-numeral: "Kleemax", "Orbitron", sans-serif;
  --font-ui:      "Rajdhani", sans-serif;

  --ease: cubic-bezier(.32,.72,0,1);
  --ease-spring: cubic-bezier(.34,1.56,.64,1);

  --maxw: 640px;
  --cut: 14px;
}

*{ box-sizing:border-box; }
html{ scroll-behavior:smooth; }

body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:var(--font-ui);
  font-weight:500;
  font-size:16px;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
  position:relative;
  overflow-x:hidden;
}

a{ color:inherit; }
::selection{ background:var(--cyan); color:#000; }

/* ---------------- animated grid + glow background ---------------- */
.bg-grid{
  position:fixed; inset:-2px;
  z-index:0; pointer-events:none;
  background-image:
    linear-gradient(rgba(87,230,255,0.06) 1px, transparent 1px),
    linear-gradient(90deg, rgba(87,230,255,0.06) 1px, transparent 1px);
  background-size:42px 42px;
  animation:gridDrift 16s linear infinite;
  mask-image:radial-gradient(ellipse 80% 60% at 50% 20%, #000 40%, transparent 90%);
}
@keyframes gridDrift{ to{ background-position:42px 84px; } }

.bg-glow{
  position:fixed; top:-20%; left:50%; transform:translateX(-50%);
  width:120vw; height:60vh; z-index:0; pointer-events:none;
  background:radial-gradient(ellipse at center, rgba(87,230,255,0.14), transparent 70%);
  animation:glowPulse 6s ease-in-out infinite;
}
@keyframes glowPulse{ 0%,100%{ opacity:0.7; } 50%{ opacity:1; } }

.bg-scan{
  position:fixed; left:0; right:0; height:2px; z-index:3; pointer-events:none;
  background:linear-gradient(90deg, transparent, rgba(87,230,255,0.55), transparent);
  mix-blend-mode:screen;
  animation:scanSweep 7s linear infinite;
}
@keyframes scanSweep{ 0%{ top:-2%; opacity:0; } 8%{ opacity:1; } 92%{ opacity:1; } 100%{ top:102%; opacity:0; } }

.motes{ position:fixed; inset:0; z-index:1; pointer-events:none; overflow:hidden; }
.mote{
  position:absolute; bottom:-10px; border-radius:50%;
  background:var(--cyan); opacity:0.55;
  box-shadow:0 0 8px var(--cyan);
  animation-name:moteRise; animation-timing-function:ease-in; animation-iteration-count:infinite;
}
@keyframes moteRise{
  0%{ transform:translateY(0) translateX(0); opacity:0; }
  10%{ opacity:0.6; }
  100%{ transform:translateY(-108vh) translateX(var(--drift,20px)); opacity:0; }
}

@media (prefers-reduced-motion:reduce){
  .bg-grid, .bg-glow, .bg-scan, .mote{ animation:none !important; }
}

/* ---------------- boot overlay ---------------- */
.boot{
  position:fixed; inset:0; z-index:50;
  background:#000;
  display:flex; align-items:center; justify-content:center;
  font-family:var(--font-display);
  color:var(--cyan);
  letter-spacing:0.3em;
  font-size:13px;
  animation:bootOut 0.5s var(--ease) 1.3s forwards;
}
.boot span{ animation:bootFlicker 1.3s steps(6) forwards; }
@keyframes bootFlicker{
  0%{ opacity:0; } 10%{ opacity:1; } 18%{ opacity:0.2; } 26%{ opacity:1; }
  70%{ opacity:1; } 100%{ opacity:1; }
}
@keyframes bootOut{ to{ opacity:0; visibility:hidden; pointer-events:none; } }
@media (prefers-reduced-motion:reduce){
  .boot{ animation-duration:0.01s; animation-delay:0.2s; }
}

/* ---------------- top HUD readout ---------------- */
.readout{
  position:fixed; top:0; left:0; right:0; z-index:10;
  display:flex; justify-content:space-between; align-items:center;
  padding:14px 18px;
  font-family:var(--font-display);
  font-size:10px; letter-spacing:0.12em;
  color:var(--ink-dim);
  pointer-events:none;
  backdrop-filter:blur(2px);
}
.readout__status{ transition:color .4s var(--ease); }
.dot{ display:inline-block; width:6px; height:6px; border-radius:50%; margin-left:6px;
  box-shadow:0 0 8px currentColor; animation:dotPulse 1.4s ease-in-out infinite; }
@keyframes dotPulse{ 0%,100%{ opacity:1; transform:scale(1); } 50%{ opacity:.35; transform:scale(0.7); } }

/* ---------------- hud panel (reusable) ---------------- */
.hud-panel{
  position:relative;
  background:var(--panel);
  border:1px solid var(--line);
  backdrop-filter:blur(10px);
  clip-path:polygon(var(--cut) 0, 100% 0, 100% calc(100% - var(--cut)), calc(100% - var(--cut)) 100%, 0 100%, 0 var(--cut));
  box-shadow:0 0 0 1px rgba(87,230,255,0.04), 0 0 26px rgba(87,230,255,0.08), inset 0 0 30px rgba(87,230,255,0.03);
}
.hud-corner{ position:absolute; width:14px; height:14px; pointer-events:none; opacity:0.9; }
.hud-corner::before, .hud-corner::after{ content:""; position:absolute; background:var(--cyan); box-shadow:0 0 6px var(--cyan); }
.hud-corner--tl{ top:-1px; left:-1px; }
.hud-corner--tl::before{ width:14px; height:2px; top:0; left:0; }
.hud-corner--tl::after{ width:2px; height:14px; top:0; left:0; }
.hud-corner--br{ bottom:-1px; right:-1px; }
.hud-corner--br::before{ width:14px; height:2px; bottom:0; right:0; }
.hud-corner--br::after{ width:2px; height:14px; bottom:0; right:0; }

.hud-panel.reveal{ opacity:0; transform:scale(.92); filter:blur(8px); transition:opacity .6s var(--ease), transform .6s var(--ease), filter .6s var(--ease); }
.hud-panel.reveal.in-view{ opacity:1; transform:scale(1); filter:blur(0); }
@media (prefers-reduced-motion:reduce){
  .hud-panel.reveal{ transition:opacity .2s linear; transform:none; filter:none; }
}

/* ================================================================
   HERO
   ================================================================ */
.hero{
  min-height:100svh; position:relative; z-index:2;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  text-align:center; padding:90px 20px 60px;
}

.hero__mark{
  margin:0; font-family:var(--font-numeral); font-weight:400;
  font-size:clamp(46px, 15vw, 92px); letter-spacing:0.03em; line-height:1;
  color:var(--ink);
}
.float-letter{
  display:inline-block; will-change:transform, filter;
  animation:floaty 3.4s ease-in-out infinite;
  animation-delay:calc(var(--i) * 0.09s);
}
.float-letter.is-duck{ color:var(--duck); }
@keyframes floaty{
  0%,100%{ transform:translateY(0); filter:drop-shadow(0 10px 10px rgba(87,230,255,.35)) drop-shadow(0 2px 3px rgba(0,0,0,.7)); }
  50%{ transform:translateY(-10px); filter:drop-shadow(0 22px 16px rgba(87,230,255,.18)) drop-shadow(0 2px 3px rgba(0,0,0,.7)); }
}
@media (prefers-reduced-motion:reduce){ .float-letter{ animation:none; filter:drop-shadow(0 4px 6px rgba(87,230,255,.3)); } }

.hero__sub{
  font-family:var(--font-display); font-weight:700; font-size:clamp(13px, 3.6vw, 18px);
  letter-spacing:0.3em; color:var(--violet); text-transform:uppercase; margin:14px 0 0;
  text-shadow:0 0 14px rgba(155,123,255,0.6);
  opacity:0; animation:fadeUp .7s var(--ease) 1.5s forwards;
}

.hero__lines{ margin-top:28px; display:flex; flex-direction:column; gap:6px; font-size:15px; color:var(--ink); }
.hero__lines span{ opacity:0; transform:translateY(10px); animation:fadeUp .6s var(--ease) forwards; }
@keyframes fadeUp{ to{ opacity:1; transform:translateY(0); } }

.hero__cta{
  margin-top:40px; position:relative; overflow:hidden;
  font-family:var(--font-display); font-weight:700; font-size:13px;
  letter-spacing:0.18em; text-transform:uppercase;
  color:var(--bg); background:linear-gradient(135deg, var(--cyan), var(--violet));
  border:none; padding:16px 36px; cursor:pointer;
  clip-path:polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
  box-shadow:0 0 24px rgba(87,230,255,0.35);
  transition:transform .3s var(--ease-spring), box-shadow .3s var(--ease);
  opacity:0; animation:fadeUp .6s var(--ease) 1.9s forwards;
}
.hero__cta:hover{ transform:translateY(-3px) scale(1.03); box-shadow:0 8px 32px rgba(87,230,255,0.5); }
.hero__cta:active{ transform:translateY(0) scale(0.97); }
.hero__cta:focus-visible{ outline:2px solid var(--cyan); outline-offset:4px; }
.ripple{ position:absolute; border-radius:50%; background:rgba(255,255,255,0.5); transform:scale(0); animation:rippleOut .6s ease-out forwards; pointer-events:none; }
@keyframes rippleOut{ to{ transform:scale(3.2); opacity:0; } }

/* ---------------- countdown ---------------- */
.countdown{ margin-top:56px; opacity:0; animation:fadeUp .7s var(--ease) 2.1s forwards; }
.countdown__label{ font-family:var(--font-display); font-size:10px; letter-spacing:0.24em; color:var(--ink-dim); text-transform:uppercase; margin-bottom:14px; }
.countdown__row{ display:flex; gap:12px; justify-content:center; }
.countdown__unit{ display:flex; flex-direction:column; align-items:center; }
.cd-tile{
  font-family:var(--font-numeral); font-weight:400;
  font-size:clamp(22px, 6.2vw, 32px); color:var(--cyan);
  min-width:56px; padding:10px 6px;
  background:var(--panel-solid); border:1px solid var(--line);
  clip-path:polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);
  text-shadow:0 0 10px rgba(87,230,255,.8), 0 0 24px rgba(87,230,255,.35);
  box-shadow:0 0 18px rgba(87,230,255,.12), inset 0 0 14px rgba(87,230,255,.06);
  font-variant-numeric:tabular-nums;
  transition:transform .15s var(--ease);
}
.cd-tile.pulse{ animation:tickPulse .45s var(--ease-spring); }
@keyframes tickPulse{ 0%{ transform:scale(1); } 35%{ transform:scale(1.18); text-shadow:0 0 18px var(--cyan), 0 0 36px var(--cyan); } 100%{ transform:scale(1); } }
.countdown__unit-label{ font-family:var(--font-display); font-size:9px; color:var(--ink-dim); letter-spacing:0.16em; margin-top:8px; }
.countdown__sep{ font-family:var(--font-display); font-size:clamp(20px,5vw,28px); color:var(--cyan-soft); align-self:center; }

.scroll-hint{
  margin-top:64px; font-family:var(--font-display); font-size:10px; color:var(--ink-dim);
  letter-spacing:0.14em; display:flex; flex-direction:column; align-items:center; gap:8px;
  opacity:0; animation:fadeUp .6s var(--ease) 2.3s forwards;
}
.scroll-hint__arrow{ animation:bob 1.6s ease-in-out infinite; color:var(--cyan); font-size:16px; text-shadow:0 0 10px var(--cyan); }
@keyframes bob{ 0%,100%{ transform:translateY(0);} 50%{ transform:translateY(7px);} }
@media (prefers-reduced-motion:reduce){ .scroll-hint__arrow{ animation:none; } }

/* ================================================================
   DOSSIER / SYSTEM WINDOW
   ================================================================ */
.dossier{ max-width:var(--maxw); margin:0 auto; padding:30px 20px 110px; position:relative; z-index:2; }

.file{ padding:28px 24px; }
.file__top{ display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:20px; gap:10px; }
.file__tag{
  font-family:var(--font-numeral); font-weight:400; font-size:15px;
  letter-spacing:0.1em; color:var(--cyan); text-transform:uppercase;
  text-shadow:0 0 10px rgba(87,230,255,.5);
}
.file__stamp{
  font-family:var(--font-numeral); font-size:11px; letter-spacing:0.1em;
  color:var(--danger); border:1px solid var(--danger); padding:4px 9px;
  text-transform:uppercase; white-space:nowrap;
  box-shadow:0 0 10px rgba(255,68,99,.25);
  animation:stampGlow 2s ease-in-out infinite;
}
@keyframes stampGlow{ 0%,100%{ box-shadow:0 0 10px rgba(255,68,99,.2); } 50%{ box-shadow:0 0 18px rgba(255,68,99,.45); } }

.file__title{ font-family:var(--font-display); font-weight:700; font-size:19px; color:var(--ink); margin:0 0 18px; letter-spacing:0.01em; }

.file__lines{ margin:0 0 18px; padding:0; list-style:none; }
.file__lines li{
  padding:10px 0; border-top:1px solid rgba(87,230,255,0.12); font-size:15px; color:var(--ink);
  opacity:0; transform:translateX(-8px);
}
.file__lines li:first-child{ border-top:none; }
.in-view .file__lines li{ animation:lineIn .5s var(--ease) forwards; }
.in-view .file__lines li:nth-child(1){ animation-delay:.15s; }
.in-view .file__lines li:nth-child(2){ animation-delay:.3s; }
.in-view .file__lines li:nth-child(3){ animation-delay:.45s; }
@keyframes lineIn{ to{ opacity:1; transform:translateX(0); } }

.file__note{ font-size:13px; color:var(--ink-dim); font-style:italic; border-left:2px solid var(--violet); padding-left:10px; margin-top:8px; }

.file__glitch{ margin-top:20px; font-family:"Rajdhani",monospace; font-size:11px; color:var(--cyan-soft); letter-spacing:0.04em; word-break:break-all; user-select:none; opacity:0.7; }

.filestrip{ display:flex; gap:8px; flex-wrap:wrap; margin-top:24px; justify-content:center; }
.filestrip__item{
  font-family:var(--font-numeral); font-size:10px; letter-spacing:0.06em;
  padding:6px 10px; border:1px solid var(--line); color:var(--ink-dim);
  clip-path:polygon(6px 0,100% 0,100% 100%,0 100%,0 6px);
  opacity:0; transform:translateY(6px);
}
.in-view .filestrip__item{ animation:fadeUp .4s var(--ease) forwards; }
.filestrip__item--seen{ color:var(--cyan); border-color:var(--cyan-soft); }
.filestrip__item--current{ color:var(--bg); background:var(--cyan); border-color:var(--cyan); box-shadow:0 0 14px rgba(87,230,255,.5); }
.filestrip__item--locked{ color:var(--ink-dim); opacity:0.5 !important; }

.launch-links{ display:flex; gap:12px; flex-wrap:wrap; justify-content:center; margin-top:36px; }
.launch-links__btn{
  font-family:var(--font-display); font-size:12px; letter-spacing:0.1em; text-transform:uppercase;
  padding:13px 24px; border:1px solid var(--cyan); color:var(--cyan); text-decoration:none; font-weight:700;
  clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px);
  transition:all .25s var(--ease); box-shadow:0 0 14px rgba(87,230,255,.2);
}
.launch-links__btn:hover{ background:var(--cyan); color:var(--bg); box-shadow:0 0 26px rgba(87,230,255,.5); }
.launch-links__empty{ margin-top:34px; font-family:var(--font-display); font-size:11px; color:var(--ink-dim); letter-spacing:0.08em; }

footer{ text-align:center; padding:30px 20px 50px; font-family:var(--font-display); font-size:9.5px; color:var(--ink-dim); letter-spacing:0.08em; position:relative; z-index:2; }
</style>
</head>

    note:"The Duck was never lost. It was waiting.",
    glitch:"decrypting FILE_06... 92%... hold." },
  { from:"2026-09-12T00:00:00+01:00", tag:"FINAL WARNING", stamp:"LAST CALL", status:"IMMINENT",
    title:"Tomorrow, the search ends",
    lines:["Tomorrow, everything changes.","04:04 won't just be a mystery anymore.","Last chance to guess before the file opens."],
    note:"Set an alarm. Or don't sleep. Your call.",
    glitch:"T-minus 1 day // countdown locked // no more clues" },
  { from:LAUNCH_ISO, tag:"FILE 06", stamp:"FOUND", status:"FOUND",
    title:"The Duck has been found",
    lines:["DUCK404 is live.","Everything that disappeared is back."],
    note:"04:04 was never the end of the story. It was the launch code.",
    glitch:"DUCK404 // STATUS: ONLINE // WELCOME BACK",
    isLaunch:true }
];

/* ================================================================
   RUNTIME
   ================================================================ */
const STATUS_COLOR = {
  MISSING:"var(--duck)", SEARCHING:"var(--cyan)", TRACKING:"var(--cyan)",
  "CLOSING IN":"var(--cyan)", IDENTIFIED:"var(--violet)", IMMINENT:"var(--danger)",
  FOUND:"var(--duck)"
};

function getPhaseIndex(now){
  const params = new URLSearchParams(location.search);
  const forced = params.get("day");
  if(forced !== null){
    const n = parseInt(forced, 10);
    if(!isNaN(n) && n >= 0 && n < FILES.length) return n;
  }
  let idx = 0;
  for(let i=0;i<FILES.length;i++){ if(now >= new Date(FILES[i].from)) idx = i; }
  return idx;
}

// build floating letters
(function initTitle(){
  const word = "DUCK404";
  const el = document.getElementById("markText");
  [...word].forEach((ch,i)=>{
    const span = document.createElement("span");
    span.className = "float-letter" + (/[0-9]/.test(ch) ? " is-duck" : "");
    span.style.setProperty("--i", i);
    span.textContent = ch;
    el.appendChild(span);
  });
})();

// motes
(function initMotes(){
  const wrap = document.getElementById("motes");
  const n = 14;
  for(let i=0;i<n;i++){
    const m = document.createElement("span");
    m.className = "mote";
    const size = 2 + Math.random()*3;
    m.style.width = size+"px"; m.style.height = size+"px";
    m.style.left = Math.random()*100 + "vw";
    m.style.setProperty("--drift", (Math.random()*40-20)+"px");
    m.style.animationDuration = (6 + Math.random()*8) + "s";
    m.style.animationDelay = (Math.random()*8) + "s";
    wrap.appendChild(m);
  }
})();

let prevDigits = {};
function render(){
  const now = new Date();
  const idx = getPhaseIndex(now);
  const phase = FILES[idx];
  const isLaunch = !!phase.isLaunch;
  const color = STATUS_COLOR[phase.status] || "var(--cyan)";

  document.getElementById("readoutStatusText").textContent = phase.status;
  document.getElementById("readoutStatus").style.color = color;
  document.getElementById("statusDot").style.color = color;

  document.getElementById("fileTag").textContent = phase.tag;
  document.getElementById("fileStamp").textContent = phase.stamp;
  document.getElementById("fileStamp").style.color = color;
  document.getElementById("fileStamp").style.borderColor = color;
  document.getElementById("fileTitle").textContent = phase.title;
  document.getElementById("fileGlitch").textContent = phase.glitch || "";
  document.getElementById("fileNote").textContent = phase.note || "";

  const list = document.getElementById("fileLines");
  list.innerHTML = "";
  (phase.lines||[]).forEach(l=>{ const li=document.createElement("li"); li.textContent=l; list.appendChild(li); });

  const strip = document.getElementById("filestrip");
  strip.innerHTML = "";
  FILES.forEach((f,i)=>{
    if(f.isLaunch) return;
    const el = document.createElement("span");
    el.className = "filestrip__item " + (i===idx?"filestrip__item--current":(i<idx?"filestrip__item--seen":"filestrip__item--locked"));
    el.style.animationDelay = (i*0.05)+"s";
    el.textContent = i<=idx ? f.tag : "LOCKED";
    strip.appendChild(el);
  });

  if(isLaunch){
    document.getElementById("heroSub").textContent = "THE DUCK HAS BEEN FOUND";
    document.getElementById("heroLines").innerHTML =
      '<span style="animation-delay:1.1s">DUCK404 is live.</span><span style="animation-delay:1.35s">Everything that disappeared is back.</span>';
    document.getElementById("findBtn").style.display = "none";
    document.getElementById("countdownWrap").style.display = "none";
    document.getElementById("scrollHint").querySelector("span").textContent = "open the file";

    const linksWrap = document.getElementById("launchLinks");
    linksWrap.innerHTML = "";
    if(LINKS.length){
      const row = document.createElement("div"); row.className = "launch-links";
      LINKS.forEach(l=>{ const a=document.createElement("a"); a.href=l.url; a.target="_blank"; a.rel="noopener"; a.className="launch-links__btn"; a.textContent=l.label; row.appendChild(a); });
      linksWrap.appendChild(row);
    } else {
      const p = document.createElement("p"); p.className="launch-links__empty"; p.textContent="COMMS CHANNELS: SYNCING..."; linksWrap.appendChild(p);
    }
  }

  document.getElementById("footerLog").textContent = "TRANSMISSION LOGGED // " + now.toUTCString().slice(0,22).toUpperCase();
}

function setDigit(id, val){
  const el = document.getElementById(id);
  const str = String(val).padStart(2,"0");
  if(prevDigits[id] !== str){
    prevDigits[id] = str;
    el.textContent = str;
    el.classList.remove("pulse");
    void el.offsetWidth;
    el.classList.add("pulse");
  }
}

function tickCountdown(){
  const launch = new Date(LAUNCH_ISO);
  const now = new Date();
  const diff = launch - now;
  const label = document.getElementById("countdownLabel");
  if(diff <= 0){
    label.textContent = "Launch complete";
    setDigit("cdD",0); setDigit("cdH",0); setDigit("cdM",0); setDigit("cdS",0);
    return;
  }
  label.textContent = "Countdown to launch";
  const s = Math.floor(diff/1000);
  setDigit("cdD", Math.floor(s/86400));
  setDigit("cdH", Math.floor((s%86400)/3600));
  setDigit("cdM", Math.floor((s%3600)/60));
  setDigit("cdS", s%60);
}

document.getElementById("findBtn").addEventListener("click", (e)=>{
  const btn = e.currentTarget;
  const r = document.createElement("span");
  r.className = "ripple";
  const rect = btn.getBoundingClientRect();
  const size = Math.max(rect.width, rect.height);
  r.style.width = r.style.height = size+"px";
  r.style.left = (e.clientX - rect.left - size/2)+"px";
  r.style.top = (e.clientY - rect.top - size/2)+"px";
  btn.appendChild(r);
  setTimeout(()=>r.remove(), 650);
  document.querySelector(".dossier").scrollIntoView({behavior:"smooth"});
});

const io = new IntersectionObserver((entries)=>{
  entries.forEach(entry=>{ if(entry.isIntersecting) entry.target.classList.add("in-view"); });
},{ threshold:0.25 });
io.observe(document.getElementById("filePanel"));

render();
tickCountdown();
setInterval(tickCountdown, 1000);
setInterval(render, 60000);
</script>
</body>
</html>
